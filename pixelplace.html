<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>PixelPlace</title>
<style>
/* Layout: the map fills the whole screen; zoom buttons and the colour/place bar float over it as frosted-glass panels. */
:root{
  --sky:#000000;                 /* plain black behind the map */
  --glass:rgba(28,30,40,.48);
  --glass-hi:rgba(255,255,255,.14);
  --edge:rgba(255,255,255,.2);
  --shade:rgba(0,0,0,.5);
  --fg:#f2f3f8;
  --muted:rgba(242,243,248,.5);
  --accent:#5b6cff;
  --font:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{color:var(--fg);font-family:var(--font);overflow:hidden;background:var(--sky)}
.app{position:relative;height:100%}
.stage{position:absolute;inset:0;overflow:hidden;cursor:crosshair;touch-action:none}
.stage.dragging{cursor:grabbing}
.status{position:absolute;left:16px;top:16px;padding:9px 13px;border-radius:14px;font-size:12px;color:var(--fg);max-width:min(70vw,360px);z-index:2}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e5a000;margin-right:7px}
.status.online .dot{background:#35d07f}
.status.error .dot{background:#ff6262}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--font);-webkit-tap-highlight-color:transparent}

.glass{background:var(--glass);border:1px solid var(--edge);box-shadow:0 10px 30px var(--shade),inset 0 1px 0 var(--edge);
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}

.zoom{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:20px}
.zoom button{width:44px;height:44px;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--fg);font-size:22px;font-weight:800;line-height:1;cursor:pointer;transition:background .15s,border-color .15s}
.zoom button:hover{background:var(--glass-hi);border-color:var(--edge)}
.zoom button:active{transform:scale(.94)}

.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);
  padding:12px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:12px 16px;flex-wrap:wrap}
.palette{display:grid;grid-template-columns:repeat(16,34px);gap:6px}
.sw-btn{width:34px;height:34px;border:1px solid transparent;border-radius:12px;background:transparent;cursor:pointer;padding:0;position:relative;transition:background .15s,border-color .15s}
.sw-btn::after{content:"";position:absolute;inset:6px;border-radius:3px;background:var(--c);box-shadow:0 2px 6px var(--shade),inset 0 0 0 1px rgba(0,0,0,.12)}
.sw-btn:hover{background:var(--glass-hi)}
.sw-btn[aria-pressed="true"]{background:var(--glass-hi);border-color:var(--edge)}
.sw-btn[aria-pressed="true"]::after{box-shadow:0 0 0 2px var(--glass-hi),0 0 0 4px var(--accent)}

.place{min-width:210px;height:52px;border:1px solid var(--edge);border-radius:18px;background:var(--accent);color:#fff;font-size:16px;font-weight:800;cursor:pointer;position:relative;overflow:hidden;font-variant-numeric:tabular-nums;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .15s,background .15s}
.place:hover:not(:disabled){transform:translateY(-1px)}
.place:active:not(:disabled){transform:scale(.97)}
.place:disabled{background:var(--glass-hi);color:var(--muted);cursor:not-allowed;box-shadow:none}
.place .bar{position:absolute;left:14px;bottom:8px;height:4px;border-radius:2px;background:var(--accent);max-width:calc(100% - 28px)}
.sw-btn:focus-visible,.place:focus-visible,.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){
  .dock{width:calc(100% - 32px)}
  .palette{grid-template-columns:repeat(8,1fr);width:100%}
  .sw-btn{width:100%}
  .place{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="status" class="status glass"><span class="dot"></span><span id="statusText">Connexion à PixelPlace…</span></div>
    <div class="zoom glass"><button id="zin" aria-label="Zoomer">+</button><button id="zout" aria-label="Dézoomer">−</button><button id="zfit" aria-label="Voir toute la carte">⤢</button></div>
  </div>
  <div class="dock glass"><div class="palette" id="palette" role="group" aria-label="Couleur"></div><button class="place" id="placeBtn" disabled><span id="placeLbl">Connexion…</span><span class="bar" id="bar"></span></button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';
const SUPABASE_URL = 'https://fpjxfuhwumiymfrnqssq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NRx49ZTWnuO390kQfpvt6w_vRTLi6vv';
const W=1000,H=1000,COOLDOWN=5*60*1000;
const PALETTE=["#FFFFFF","#E4E4E4","#888888","#222222","#FFA7D1","#E50000","#E59500","#A06A42","#E5D900","#94E044","#02BE01","#00D3DD","#0083C7","#0000EA","#CF6EE4","#820080"];
const NAMES=["Blanc","Gris clair","Gris","Noir","Rose","Rouge","Orange","Marron","Jaune","Vert clair","Vert","Cyan","Bleu","Bleu roi","Mauve","Violet"];
const $=id=>document.getElementById(id),stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const octx=off.getContext('2d'),img=octx.createImageData(W,H),gc=new Int8Array(W*H).fill(-1);
let supabase=null,uid=null,connected=false,canWrite=false,last=0,sel=null,color=5,busy=false,flash=null,view=null,raf=0;
const RGB=PALETTE.map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
function paintCell(i){const c=gc[i]<0?RGB[0]:RGB[gc[i]],o=i*4;img.data[o]=c[0];img.data[o+1]=c[1];img.data[o+2]=c[2];img.data[o+3]=255;}
for(let i=0;i<W*H;i++)paintCell(i);octx.putImageData(img,0,0);
function setStatus(text,kind=''){$('statusText').textContent=text;$('status').className='status glass '+kind;}
function setCell(x,y,c){const i=y*W+x;if(gc[i]===c)return false;gc[i]=c;paintCell(i);return true;}
function flush(x,y,w,h){octx.putImageData(img,0,0,x,y,w,h);draw();}
function size(){const r=stage.getBoundingClientRect();return[r.width,r.height];}
function fitScale(){const[w,h]=size();return Math.min(w,h)*.96/W;}
function fit(){const[w,h]=size(),s=fitScale();view={s,x:(w-W*s)/2,y:(h-H*s)/2};draw();}
function startView(){const[w,h]=size(),s=6;view={s,x:w/2-W/2*s,y:h/2-H/2*s};}
function resize(){const d=devicePixelRatio||1,[w,h]=size();cv.width=Math.round(w*d);cv.height=Math.round(h*d);draw();}
function zoomAt(f,cx,cy){const ns=Math.min(50,Math.max(fitScale()*.8,view.s*f));view.x=cx-(cx-view.x)*ns/view.s;view.y=cy-(cy-view.y)*ns/view.s;view.s=ns;draw();}
const mid=()=>{const[w,h]=size();return[w/2,h/2];};
$('zin').onclick=()=>zoomAt(1.6,...mid());$('zout').onclick=()=>zoomAt(1/1.6,...mid());$('zfit').onclick=fit;
function draw(){if(!raf)raf=requestAnimationFrame(render);}
function render(){raf=0;const d=devicePixelRatio||1,{s,x,y}=view;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(off,x,y,W*s,H*s);
if(s>=12){const[w,h]=size(),x0=Math.max(0,Math.floor(-x/s)),x1=Math.min(W,Math.ceil((w-x)/s)),y0=Math.max(0,Math.floor(-y/s)),y1=Math.min(H,Math.ceil((h-y)/s));ctx.strokeStyle='#00000014';ctx.lineWidth=1;ctx.beginPath();for(let i=x0;i<=x1;i++){const p=Math.round(x+i*s)+.5;ctx.moveTo(p,y+y0*s);ctx.lineTo(p,y+y1*s);}for(let j=y0;j<=y1;j++){const p=Math.round(y+j*s)+.5;ctx.moveTo(x+x0*s,p);ctx.lineTo(x+x1*s,p);}ctx.stroke();}
if(sel){const px=x+sel.x*s,py=y+sel.y*s,q=Math.max(s,4),o=(q-s)/2;ctx.globalAlpha=.6;ctx.fillStyle=PALETTE[color];ctx.fillRect(px,py,s,s);ctx.globalAlpha=1;ctx.strokeStyle='#ffcf3a';ctx.lineWidth=2;ctx.strokeRect(px-o-2,py-o-2,q+4,q+4);ctx.strokeStyle='#0f1220';ctx.lineWidth=1;ctx.strokeRect(px-o-3.5,py-o-3.5,q+7,q+7);}}
const pal=$('palette');PALETTE.forEach((c,i)=>{const b=document.createElement('button');b.className='sw-btn';b.style.setProperty('--c',c);b.setAttribute('aria-label',NAMES[i]);b.title=NAMES[i];b.setAttribute('aria-pressed',i===color);b.onclick=()=>{color=i;[...pal.children].forEach((x,j)=>x.setAttribute('aria-pressed',j===i));draw();};pal.appendChild(b);});
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
const pts=new Map();let drag=null,pinch=null;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.zoom')||e.target.closest('.status'))return;stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===1)drag={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,moved:false};if(pts.size===2){const[a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s};drag=null;}});
stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&pts.size===2){const r=stage.getBoundingClientRect(),[a,b]=[...pts.values()];zoomAt(pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d/view.s,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return;}if(drag){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>5){drag.moved=true;stage.classList.add('dragging');}if(drag.moved){view.x=drag.vx+dx;view.y=drag.vy+dy;draw();}}});
function endPtr(e){if(drag&&!drag.moved&&pts.size===1){const r=stage.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-view.x)/view.s),y=Math.floor((e.clientY-r.top-view.y)/view.s);if(x>=0&&y>=0&&x<W&&y<H){sel={x,y};updateUI();draw();}}pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size){drag=null;stage.classList.remove('dragging');}}
stage.addEventListener('pointerup',endPtr);stage.addEventListener('pointercancel',endPtr);
const remaining=()=>Math.max(0,last+COOLDOWN-Date.now());const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function updateUI(){const rem=remaining(),btn=$('placeBtn'),lbl=$('placeLbl');$('bar').style.width=rem?`calc((100% - 28px) * ${1-rem/COOLDOWN})`:'0';btn.disabled=true;if(flash&&Date.now()<flash.until){lbl.textContent=flash.text;return;}if(!connected)lbl.textContent='Connexion…';else if(!canWrite)lbl.textContent='Lecture seule';else if(busy)lbl.textContent='Pose…';else if(rem)lbl.textContent='Attendre '+fmt(rem);else if(!sel)lbl.textContent='Choisir une case';else{btn.disabled=false;lbl.textContent='Poser le pixel';}}
setInterval(updateUI,250);function say(text){flash={text,until:Date.now()+4000};updateUI();}
async function loadPixels(){let from=0;const page=1000;while(true){const{data,error}=await supabase.from('pixels').select('x,y,color').order('x').order('y').range(from,from+page-1);if(error)throw error;for(const p of data){if(Number.isInteger(p.x)&&Number.isInteger(p.y)&&p.color>=0&&p.color<16)setCell(p.x,p.y,p.color);}if(data.length<page)break;from+=page;}flush(0,0,W,H);}
function applyRemote(p){if(!p||!Number.isInteger(p.x)||!Number.isInteger(p.y)||p.x<0||p.x>=W||p.y<0||p.y>=H||p.color<0||p.color>=16)return;if(setCell(p.x,p.y,p.color))flush(p.x,p.y,1,1);}
$('placeBtn').onclick=async()=>{if(!sel||remaining()||busy||!canWrite||!connected)return;const{x,y}=sel,c=color,prev=gc[y*W+x];busy=true;updateUI();setCell(x,y,c);flush(x,y,1,1);try{const{error}=await supabase.from('pixels').upsert({x,y,color:c},{onConflict:'x,y'});if(error)throw error;last=Date.now();sel=null;draw();say('Pixel placé !');}catch(e){setCell(x,y,prev);flush(x,y,1,1);const msg=String(e?.message||'');if(/5 minutes|Attends/i.test(msg)){const{data}=await supabase.from('pixel_history').select('placed_at').eq('player_id',uid).order('placed_at',{ascending:false}).limit(1);if(data?.[0])last=new Date(data[0].placed_at).getTime();say('Attends la fin du délai');}else if(/Connexion requise|JWT|auth/i.test(msg))say('Connexion expirée : recharge la page');else say('Erreur : '+msg.slice(0,70));console.error('PixelPlace:',e);}finally{busy=false;updateUI();}};
async function start(){resize();if(!view)startView();draw();updateUI();try{if(!window.supabase?.createClient)throw new Error('La bibliothèque de connexion ne charge pas. Vérifie Internet.');supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let{data:sessionData,error:sessionError}=await supabase.auth.getSession();if(sessionError)throw sessionError;if(!sessionData.session){const{error}=await supabase.auth.signInAnonymously();if(error)throw error;}const{data:userData,error:userError}=await supabase.auth.getUser();if(userError)throw userError;uid=userData.user.id;canWrite=true;
const{data:history,error:historyError}=await supabase.from('pixel_history').select('placed_at').eq('player_id',uid).order('placed_at',{ascending:false}).limit(1);if(!historyError&&history?.[0])last=new Date(history[0].placed_at).getTime();
setStatus('Connexion à la carte…');supabase.channel('pixelplace-live').on('postgres_changes',{event:'*',schema:'public',table:'pixels'},payload=>{if(payload.eventType!=='DELETE')applyRemote(payload.new);}).subscribe(status=>{if(status==='SUBSCRIBED'){connected=true;setStatus('En ligne · pixels synchronisés','online');updateUI();}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){setStatus('Synchronisation interrompue','error');}});
await loadPixels();setStatus('En ligne · pixels synchronisés','online');connected=true;updateUI();
}catch(e){console.error('Connexion PixelPlace:',e);connected=false;canWrite=false;setStatus('Connexion impossible : '+String(e?.message||e).slice(0,100),'error');updateUI();}}
new ResizeObserver(resize).observe(stage);start();
})();
</script>
</body>
</html>
